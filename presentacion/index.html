<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hoja de Ruta Digital</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
<style>
/* VOICE: intro de videojuego de los 90 grabada en VHS, misteriosa, sin exagerar
   IDEA: la pantalla de inicio de un juego reproducida desde una cinta vieja
   PICTURE: alien grande de espaldas, vivo (respira y gesticula), a la izquierda sobre espacio con galaxia
   COLOUR and TYPE: noche azul-verdosa, verde fosforo de acento; Press Start 2P + VT323
   LAYOUT: alien a la izquierda, titulo y dialogo a la derecha, HUD VHS en esquinas */
:root{color-scheme:dark;--bg:#03070c;--ink:#e6f2ea;--glow:#9dffc6;--dim:#7d9a8f}
*{box-sizing:border-box;min-width:0}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);overflow:hidden}
body{font:24px/1.3 "VT323",monospace}
.stage{position:fixed;inset:0;overflow:hidden;animation:jit 9s steps(1) infinite}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
#noise{opacity:.07;mix-blend-mode:screen;pointer-events:none;image-rendering:pixelated}

/* --- alien (deformacion tipo Live2D en WebGL) --- */
.alien{position:absolute;left:-1vw;bottom:-3vh;height:min(107vh,68vw);aspect-ratio:840/933}
.alien canvas,.alien img{position:absolute;inset:0;width:100%;height:100%;display:block;
  filter:url(#rgb) contrast(1.05) saturate(.9) sepia(.06) brightness(1.1)}
.alien img{object-fit:contain;object-position:left bottom;visibility:hidden}
.alien.nogl img{visibility:visible}

/* --- titulo: centrado en vertical a la derecha --- */
.title{position:absolute;right:6vw;top:0;bottom:0;width:min(46vw,640px);display:flex;flex-direction:column;
  justify-content:center;text-align:center;opacity:0}
.title.go{animation:fadeup 1.4s ease-out 1.2s forwards}
.title h1{margin:0;font:400 clamp(22px,3.4vw,48px)/1.35 "Press Start 2P",monospace;color:#f3fff7;
  text-shadow:2px 0 rgba(255,40,80,.55),-2px 0 rgba(40,220,255,.55),0 0 18px rgba(157,255,198,.35)}
.title .sub{margin:3.5vh 0 0;font:400 clamp(11px,1.15vw,16px)/1.6 "Press Start 2P",monospace;color:var(--glow);
  letter-spacing:.06em}
@keyframes fadeup{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}

/* --- creditos en la esquina inferior izquierda --- */
.credits{position:absolute;left:4vw;bottom:3vh;font-size:clamp(18px,1.5vw,24px);line-height:1.25;color:#d6e4dc;
  text-shadow:1px 0 rgba(255,50,80,.5),-1px 0 rgba(40,220,255,.5),0 0 6px #000,0 0 12px #000;opacity:0}
.credits.go{animation:fadeup 1s ease-out 2s forwards}
.credits b{font-weight:400;color:var(--glow)}

/* --- capa VHS --- */
.vhs{position:absolute;inset:0;pointer-events:none}
.scan{background:repeating-linear-gradient(to bottom,rgba(0,0,0,.22) 0 1px,transparent 1px 3px)}
.vig{background:radial-gradient(ellipse at center,transparent 55%,rgba(0,0,0,.65) 100%)}
.track{position:absolute;left:0;right:0;height:7vh;top:-10vh;
  background:linear-gradient(transparent,rgba(255,255,255,.07) 40%,rgba(255,255,255,.12) 50%,transparent);
  backdrop-filter:blur(1px) brightness(1.15);animation:track 11s linear infinite}
@keyframes track{0%,70%{top:-10vh}100%{top:110vh}}
@keyframes jit{0%,100%{transform:none}91%{transform:translateX(2px)}92%{transform:translateX(-1px)}93%{transform:none}}

@media (max-width:700px){
  .alien{height:62vh;left:-12vw;bottom:-2vh}
  .title{left:5vw;right:5vw;width:auto;top:10vh;bottom:auto}
  .credits{bottom:2vh;font-size:18px}
}
@media (prefers-reduced-motion:reduce){
  .title.go,.credits.go{animation-duration:.01s;animation-delay:0s}
  .track,.stage{animation:none}
}
</style>
</head>

<script>
{
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
const space = document.getElementById('space'), sx = space.getContext('2d');
const noise = document.getElementById('noise'), nx = noise.getContext('2d');
let W = 0, H = 0, DPR = 1, stars = [], galaxy = [], mx = 0, my = 0, shoot = null;

function rnd(a, b){ return a + Math.random() * (b - a); }

function build(){
  DPR = Math.min(devicePixelRatio || 1, 2);
  W = innerWidth; H = innerHeight;
  space.width = W * DPR; space.height = H * DPR;
  sx.setTransform(DPR, 0, 0, DPR, 0, 0);
  noise.width = Math.max(1, Math.ceil(W / 3)); noise.height = Math.max(1, Math.ceil(H / 3));
  const n = Math.round(W * H / 2600);
  stars = Array.from({length: n}, () => ({
    x: Math.random() * W, y: Math.random() * H, z: rnd(.2, 1),
    r: Math.random() < .04 ? rnd(1.2, 1.9) : rnd(.3, 1.1),
    t: rnd(0, 6.28), s: rnd(.6, 2.2),
    c: Math.random() < .15 ? '200,220,255' : Math.random() < .1 ? '255,225,190' : '240,248,255'
  }));
  galaxy = Array.from({length: 6000}, () => {
    const arm = Math.floor(Math.random() * 2), d = Math.pow(Math.random(), 1.1);
    return { d, a: arm * Math.PI + d * 6 + rnd(-.3, .3) * (1 - d * .4),
      off: rnd(-.04, .04), r: rnd(.4, 1.4), b: rnd(.35, 1) };
  });
}

function drawNebula(){
  const g1 = sx.createRadialGradient(W*.72, H*.35, 0, W*.72, H*.35, W*.45);
  g1.addColorStop(0, 'rgba(40,90,110,.28)'); g1.addColorStop(1, 'rgba(0,0,0,0)');
  sx.fillStyle = g1; sx.fillRect(0, 0, W, H);
  const g2 = sx.createRadialGradient(W*.25, H*.7, 0, W*.25, H*.7, W*.5);
  g2.addColorStop(0, 'rgba(30,70,65,.35)'); g2.addColorStop(1, 'rgba(0,0,0,0)');
  sx.fillStyle = g2; sx.fillRect(0, 0, W, H);
  const g3 = sx.createRadialGradient(W*.9, H*.85, 0, W*.9, H*.85, W*.3);
  g3.addColorStop(0, 'rgba(90,50,110,.18)'); g3.addColorStop(1, 'rgba(0,0,0,0)');
  sx.fillStyle = g3; sx.fillRect(0, 0, W, H);
}

function drawGalaxy(t){
  const cx = W * (W < 700 ? .62 : .84) - mx * 6, cy = H * (W < 700 ? .3 : .3) - my * 6;
  const R = Math.min(W, H) * .62, rot = t * .000015;
  const core = sx.createRadialGradient(cx, cy, 0, cx, cy, R * .3);
  core.addColorStop(0, 'rgba(255,240,215,.5)'); core.addColorStop(.4, 'rgba(160,190,220,.15)');
  core.addColorStop(1, 'rgba(0,0,0,0)');
  sx.fillStyle = core; sx.beginPath(); sx.arc(cx, cy, R * .3, 0, 7); sx.fill();
  for (const p of galaxy){
    const a = p.a + rot, rr = p.d * R;
    const x0 = Math.cos(a) * rr + p.off * R, y0 = Math.sin(a) * rr * .38 + p.off * R * .25, x = cx + x0 * .96 - y0 * .28, y = cy + x0 * .28 + y0 * .96;
    sx.fillStyle = p.d < .25 ? `rgba(255,236,210,${p.b*.8})` : (p.d > .5 && p.b > .9 ? `rgba(220,170,230,${(1-p.d)*.7})` : `rgba(175,210,235,${p.b*(1-p.d*.8)*.6})`);
    sx.fillRect(x, y, p.r, p.r);
  }
}

function frame(t){
  sx.fillStyle = '#03070c'; sx.fillRect(0, 0, W, H);
  drawNebula();
  drawGalaxy(t);
  for (const s of stars){
    const tw = reduce ? .8 : .55 + .45 * Math.sin(s.t + t * .001 * s.s);
    const x = (s.x - mx * 14 * s.z - t * .004 * s.z + W * 4) % W, y = s.y - my * 10 * s.z;
    sx.fillStyle = `rgba(${s.c},${tw * (s.z * .7 + .3)})`;
    sx.beginPath(); sx.arc(x, y, s.r, 0, 7); sx.fill();
    if (s.r > 1.2){ sx.fillStyle = `rgba(${s.c},${tw*.12})`; sx.beginPath(); sx.arc(x, y, s.r * 4, 0, 7); sx.fill(); }
  }
  if (!reduce){
    if (!shoot && Math.random() < .003) shoot = {x: rnd(W*.4, W), y: rnd(0, H*.4), l: 0};
    if (shoot){
      shoot.l += 1;
      const p = shoot.l * 14, x = shoot.x - p, y = shoot.y + p * .45;
      const g = sx.createLinearGradient(x, y, x + 120, y - 54);
      g.addColorStop(0, 'rgba(255,255,255,.8)'); g.addColorStop(1, 'rgba(255,255,255,0)');
      sx.strokeStyle = g; sx.lineWidth = 1.4; sx.beginPath(); sx.moveTo(x, y); sx.lineTo(x + 120, y - 54); sx.stroke();
      if (shoot.l > 40) shoot = null;
    }
  }
  if (!reduce && Math.floor(t / 50) !== frame.n){
    frame.n = Math.floor(t / 50);
    const img = nx.createImageData(noise.width, noise.height), d = img.data;
    for (let i = 0; i < d.length; i += 4){ const v = Math.random() * 255; d[i] = d[i+1] = d[i+2] = v; d[i+3] = 255; }
    nx.putImageData(img, 0, 0);
  }
  requestAnimationFrame(frame);
}

addEventListener('pointermove', e => { mx = e.clientX / W - .5; my = e.clientY / H - .5; });

/* entrada suave del titulo y los creditos (tecla R la repite) */
const els = ['title', 'credits'].map(id => document.getElementById(id));
function play(){
  els.forEach(e => { e.classList.remove('go'); void e.offsetWidth; e.classList.add('go'); });
}
addEventListener('keydown', e => { if (e.key === 'r' || e.key === 'R') play(); });

/* ===== Alien vivo: deformacion por zonas (tipo Live2D) =====
   Capas de movimiento, con retrasos entre ellas:
   1) respiracion lenta: la espalda se expande, los hombros siguen con retraso y la cabeza casi no se mueve
   2) coreografia: mira hacia la derecha con resortes, parpadea al iniciar el giro (parpadeo evocado por la mirada) y vuelve
   3) luz cian que respira y un brillo humedo en el ojo
   Coordenadas en pixeles de la imagen (840 x 903, con 30 px extra arriba). */
const alienBox = document.getElementById('alien');
const glc = document.getElementById('alienGL');
const aImg = document.getElementById('alienImg');
const gl = glc.getContext('webgl', {premultipliedAlpha: true, alpha: true});

const VS = `attribute vec2 p; varying vec2 v; void main(){ v = p * .5 + .5; gl_Position = vec4(p, 0., 1.); }`;
const FS = `precision highp float;
varying vec2 v;
uniform sampler2D tex;
uniform float uTheta, uBreath, uShoulder, uLight, uGlint, uLid;
uniform vec2 uHead, uCam;
const vec2 SIZE = vec2(840., 903.);
const float TOP = 30.;
const vec2 PIVOT = vec2(470., 640.);
mat2 rot(float a){ float c = cos(a), s = sin(a); return mat2(c, s, -s, c); }
void main(){
  /* pixel de salida en coordenadas de la imagen */
  vec2 p = vec2(v.x * SIZE.x, (1. - v.y) * (SIZE.y + TOP) - TOP);
  p -= uCam;
  /* zonas: cabeza (1 arriba, 0 bajo el cuello), espalda y hombros */
  float wHead = 1. - smoothstep(470., 660., p.y);
  float wBack = smoothstep(560., 820., p.y);
  float wShou = smoothstep(560., 680., p.y) * (1. - smoothstep(760., 903., p.y));
  /* respiracion: la espalda sube y se ensancha desde la columna (x ~ 350) */
  vec2 q = p;
  q.y += uBreath * 5.5 * wBack;
  q.x -= (p.x - 350.) * .009 * uBreath * wBack;
  q.y += uShoulder * 3.5 * wShou;
  /* cabeza: rotacion alrededor de la base del cuello + desplazamiento */
  vec2 d = q - PIVOT;
  q = PIVOT + rot(-uTheta * wHead) * d - uHead * wHead;
  vec2 uv = vec2(q.x / SIZE.x, q.y / SIZE.y);
  if (uv.x < 0. || uv.x > 1. || uv.y < 0. || uv.y > 1.) { gl_FragColor = vec4(0.); return; }
  vec4 c = texture2D(tex, uv);
  /* luz de borde cian que respira: realza zonas ya iluminadas en azul */
  float rim = clamp((c.b - c.r) * 4., 0., 1.) * smoothstep(.12, .45, c.b);
  c.rgb += vec3(.05, .16, .2) * rim * uLight * c.a;
  /* parpado: baja perpendicular a la linea del parpado superior (A-B) y cubre el ojo */
  if (uLid > .001) {
    vec2 EA = vec2(678., 293.), EB = vec2(716., 258.), EC = vec2(707., 328.);
    vec2 U = normalize(EB - EA), N = vec2(-U.y, U.x);
    float s = dot(q - EA, N);
    vec2 ac = normalize(EC - EA), w = q - EA;
    float dac = (ac.x * w.y - ac.y * w.x);
    float inside = (1. - smoothstep(-1.5, 1.5, dac)) * smoothstep(-3., -1., s);
    float lidPos = uLid * 48. - 1.;
    float cover = 1. - smoothstep(lidPos - 1.2, lidPos + 1.2, s);
    vec2 src = q - N * (s * .35 + 5.);
    vec4 lid = texture2D(tex, src / SIZE);
    float shade = mix(1., .5, smoothstep(lidPos - 7., lidPos, s)) * (1. - .25 * exp(-s * s * .08));
    c.rgb = mix(c.rgb, lid.rgb * shade, cover * inside * c.a);
  }
  /* brillo humedo del ojo */
  float eye = 1. - smoothstep(4., 16., distance(q, vec2(713., 284.)));
  c.rgb += vec3(.55, .7, .75) * eye * uGlint * (1. - uLid) * smoothstep(.25, .6, max(c.r, max(c.g, c.b))) * c.a;
  gl_FragColor = c;
}`;

/* resorte amortiguado: aceleracion y asentamiento naturales, sin curvas fijas */
function spring(v){ return {x: v, v: 0, t: v, k: 30, z: .9}; }
function stepSpring(s, dt){
  const w = Math.sqrt(s.k), a = s.k * (s.t - s.x) - 2 * s.z * w * s.v;
  s.v += a * dt; s.x += s.v * dt;
}
const theta = spring(0), hx = spring(0), hy = spring(0);
function aim(th, x, y, k, z){ for (const [s, t] of [[theta, th], [hx, x], [hy, y]]) { s.t = t; s.k = k; s.z = z; } }

/* parpadeo segun datos reales: cierre ~100 ms, cerrado breve, apertura ~200 ms
   (rapida al inicio, lenta al final). ~12 por minuto. */
let blinkT = -9, nextBlink = 2.5;
function blinkAt(t){ if (t - blinkT > .5) blinkT = t; }
function lidAmount(t){
  const x = t - blinkT;
  if (x < 0 || x > .42) return 0;
  if (x < .1) { const k = x / .1; return k * k; }          /* cierre, acelera */
  if (x < .14) return 1;                                   /* cerrado */
  const k = (x - .14) / .28; return 1 - (1 - Math.pow(1 - k, 2.4)) ; /* apertura: rapida y luego lenta */
}

/* coreografia: reposo -> mira a la derecha (parpadea al iniciar el giro) -> sostiene -> vuelve (a veces parpadea) */
const REST = [0, 0, 0], RIGHT = [-.009, 7, -1.5];
let phase = 'rest', phaseEnd = 3.5, microT = 1.5;
function choreo(t){
  if (t > phaseEnd){
    if (phase === 'rest'){
      phase = 'right'; aim(RIGHT[0] + rnd(-.003, .003), RIGHT[1] + rnd(-1, 1.5), RIGHT[2] + rnd(-1, 1), 11, .95);
      blinkAt(t + rnd(0, .08)); phaseEnd = t + rnd(2.6, 3.6);
    } else {
      phase = 'rest'; aim(rnd(-.002, .002), rnd(-.6, .6), rnd(-.5, .5), 7, 1);
      if (Math.random() < .6) blinkAt(t + rnd(.05, .2));
      phaseEnd = t + rnd(4.5, 7);
    }
    nextBlink = Math.max(nextBlink, t + rnd(1.6, 2.6));
  }
  /* parpadeo espontaneo ocasional, sin pisar el anterior */
  if (t > nextBlink){ blinkAt(t); nextBlink = t + rnd(3.5, 6.5); }
  /* micro-ajuste casi imperceptible mientras sostiene la mirada */
  if (t > microT){
    microT = t + rnd(1.2, 2.4);
    if (Math.random() < .5) { theta.t += rnd(-.002, .002); hx.t += rnd(-.5, .5); hy.t += rnd(-.4, .4); }
  }
}

let prog, tex, U = {}, glOk = false, tPrev = 0, glintT = 0, glint = 0;
function initGL(){
  if (!gl) return;
  const sh = (type, src) => { const o = gl.createShader(type); gl.shaderSource(o, src); gl.compileShader(o); return o; };
  prog = gl.createProgram();
  gl.attachShader(prog, sh(gl.VERTEX_SHADER, VS)); gl.attachShader(prog, sh(gl.FRAGMENT_SHADER, FS));
  gl.linkProgram(prog);
  if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) return;
  gl.useProgram(prog);
  const buf = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, buf);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 1, -1, -1, 1, 1, 1]), gl.STATIC_DRAW);
  const loc = gl.getAttribLocation(prog, 'p'); gl.enableVertexAttribArray(loc);
  gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);
  tex = gl.createTexture(); gl.bindTexture(gl.TEXTURE_2D, tex);
  gl.pixelStorei(gl.UNPACK_PREMULTIPLY_ALPHA_WEBGL, true);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, aImg);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  for (const n of ['uTheta', 'uBreath', 'uShoulder', 'uLight', 'uGlint', 'uLid', 'uHead', 'uCam']) U[n] = gl.getUniformLocation(prog, n);
  gl.clearColor(0, 0, 0, 0);
  glOk = true;
}

/* respiracion de criatura grande: lenta, inhalar mas corto que exhalar, con pausa */
function breath(t){
  const T = 5.8, ph = ((t % T) + T) % T / T;
  return ph < .4 ? .5 - .5 * Math.cos(Math.PI * ph / .4) : .5 + .5 * Math.cos(Math.PI * Math.min(1, (ph - .4) / .5));
}

function sizeGL(){
  const r = alienBox.getBoundingClientRect(), d = Math.min(devicePixelRatio || 1, 2);
  glc.width = Math.round(r.width * d); glc.height = Math.round(r.height * d);
  if (glOk) gl.viewport(0, 0, glc.width, glc.height);
}

function alienFrame(ms){
  const t = ms / 1000, dt = Math.min(.05, t - tPrev || .016); tPrev = t;
  if (!reduce){
    choreo(t);
    stepSpring(theta, dt); stepSpring(hx, dt); stepSpring(hy, dt);
    if (t > glintT){ glintT = t + rnd(4, 9); glint = 1; }
    glint *= Math.exp(-dt * 2.2);
  }
  const b = reduce ? 0 : breath(t), bs = reduce ? 0 : breath(t - .45), bh = reduce ? 0 : breath(t - .8);
  if (glOk){
    gl.clear(gl.COLOR_BUFFER_BIT);
    gl.uniform1f(U.uTheta, theta.x);
    gl.uniform1f(U.uBreath, b);
    gl.uniform1f(U.uShoulder, bs);
    gl.uniform2f(U.uHead, hx.x, hy.x - bh * 1.6);
    gl.uniform2f(U.uCam, mx * -10, my * -6);
    gl.uniform1f(U.uLight, reduce ? .5 : .5 + .35 * Math.sin(t * .7) * Math.sin(t * .23 + 1));
    gl.uniform1f(U.uGlint, .25 + glint * .55);
    gl.uniform1f(U.uLid, reduce ? 0 : lidAmount(t));
    gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
  }
  requestAnimationFrame(alienFrame);
}

function startAlien(){
  initGL();
  if (!glOk) { alienBox.classList.add('nogl'); return; }
  sizeGL(); requestAnimationFrame(alienFrame);
}
addEventListener('resize', sizeGL);
if (aImg.complete) startAlien(); else aImg.addEventListener('load', startAlien);

addEventListener('resize', build);
build(); play(); requestAnimationFrame(frame);
}
</script>
